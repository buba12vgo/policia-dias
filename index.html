<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Policía Portuaria - Autoridad Portuaria de Vigo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- XLSX library -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen transition-colors duration-200">
    <div id="root"></div>

    <!-- Firebase Firestore via CDN -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyC0nN9LYhqmY--jzwbHBo7Uq5mdFpYq57w",
        authDomain: "policia-dias.firebaseapp.com",
        projectId: "policia-dias",
        storageBucket: "policia-dias.firebasestorage.app",
        messagingSenderId: "497323845198",
        appId: "1:497323845198:web:6f124974138c3b758ec51f"
      };

      const app = initializeApp(firebaseConfig);
      window.db = getFirestore(app);
      window.fbDb = { doc, getDoc, setDoc, collection, getDocs };
    </script>

    <script type="text/babel">
      const { useState, useEffect } = React;

      const MESES_ORDEN = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

      function App() {
        const [userSession, setUserSession] = useState(null);
        const [agente, setAgente] = useState(null);
        const [usuarioInput, setUsuarioInput] = useState('');
        const [passwordInput, setPasswordInput] = useState('');
        const [errorLogin, setErrorLogin] = useState('');
        const [subiendoExcel, setSubiendoExcel] = useState(false);
        const [darkMode, setDarkMode] = useState(true);
        
        const [listaAgentes, setListaAgentes] = useState([]);
        const [busquedaAdmin, setBusquedaAdmin] = useState('');
        const [agenteSeleccionadoAdmin, setAgenteSeleccionadoAdmin] = useState(null);
        
        const [mesNominaSeleccionado, setMesNominaSeleccionado] = useState('');

        // Estados para el Modal de Contraseña
        const [showPassModal, setShowPassModal] = useState(false);
        const [passActual, setPassActual] = useState('');
        const [passNueva, setPassNueva] = useState('');
        const [passRepetida, setPassRepetida] = useState('');
        const [msgPass, setMsgPass] = useState({ text: '', type: '' });

        useEffect(() => {
          if (darkMode) {
            document.documentElement.classList.add('dark');
            document.body.className = "bg-slate-900 text-slate-100 min-h-screen";
          } else {
            document.documentElement.classList.remove('dark');
            document.body.className = "bg-slate-100 text-slate-800 min-h-screen";
          }
        }, [darkMode]);

        const cargarAgentesAdmin = async () => {
          try {
            const querySnapshot = await window.fbDb.getDocs(window.fbDb.collection(window.db, "policias"));
            const lista = [];
            querySnapshot.forEach((doc) => {
              lista.push(doc.data());
            });
            lista.sort((a, b) => Number(a.tip) - Number(b.tip));
            setListaAgentes(lista);
          } catch (e) {
            console.error("Error cargando agentes:", e);
          }
        };

        const handleLogin = async (e) => {
          e.preventDefault();
          setErrorLogin('');
          if (!usuarioInput || !passwordInput) {
            setErrorLogin('Introduce tu usuario y tu contraseña');
            return;
          }

          const usuarioClean = usuarioInput.toLowerCase().trim();
          const inputPass = passwordInput.trim();

          if (usuarioClean === 'rromdur') {
            setUserSession({ usuario: 'rromdur', isAdmin: true });
            cargarAgentesAdmin();
            return;
          }

          const docKey = `${usuarioClean}@policiaportuaria.local`;

          try {
            const docRef = window.fbDb.doc(window.db, "policias", docKey);
            const docSnap = await window.fbDb.getDoc(docRef);

            if (docSnap.exists()) {
              const dataAgente = docSnap.data();
              const tipAgente = String(dataAgente.tip).padStart(3, '0');
              const passReal = dataAgente.passwordPersonal || tipAgente;

              const esValido = (inputPass === passReal) || (!dataAgente.passwordPersonal && inputPass.padStart(3, '0') === tipAgente);

              if (esValido) {
                setAgente(dataAgente);
                setUserSession({ usuario: usuarioClean, isAdmin: false });
              } else {
                setErrorLogin('La contraseña introducida no es correcta.');
              }
            } else {
              setErrorLogin('Usuario de Windows no encontrado en el sistema.');
            }
          } catch (err) {
            setErrorLogin('Error de conexión al verificar los datos.');
          }
        };

        const agenteMostrado = agente || agenteSeleccionadoAdmin;
        
        useEffect(() => {
          if (agenteMostrado?.historicoNominas) {
            const mesesDisponibles = Object.keys(agenteMostrado.historicoNominas);
            mesesDisponibles.sort((a, b) => MESES_ORDEN.indexOf(a) - MESES_ORDEN.indexOf(b));
            if (mesesDisponibles.length > 0) {
              setMesNominaSeleccionado(mesesDisponibles[mesesDisponibles.length - 1]);
            } else {
              setMesNominaSeleccionado('');
            }
          }
        }, [agenteMostrado]);

        const cambiarPassword = async (e) => {
          e.preventDefault();
          setMsgPass({ text: '', type: '' });

          if (passNueva.length < 3) {
            setMsgPass({ text: 'La contraseña debe tener al menos 3 caracteres.', type: 'error' });
            return;
          }

          if (passNueva !== passRepetida) {
            setMsgPass({ text: 'Las contraseñas nuevas no coinciden.', type: 'error' });
            return;
          }

          const tipAgente = String(agente.tip).padStart(3, '0');
          const passRealActual = agente.passwordPersonal || tipAgente;
          const inputPassActual = passActual.trim();

          const actualValida = (inputPassActual === passRealActual) || (!agente.passwordPersonal && inputPassActual.padStart(3, '0') === tipAgente);

          if (!actualValida) {
            setMsgPass({ text: 'La contraseña actual es incorrecta.', type: 'error' });
            return;
          }

          try {
            const docKey = `${agente.usuarioWindows}@policiaportuaria.local`;
            await window.fbDb.setDoc(window.fbDb.doc(window.db, "policias", docKey), {
              passwordPersonal: passNueva.trim()
            }, { merge: true });

            setAgente({ ...agente, passwordPersonal: passNueva.trim() });
            setMsgPass({ text: '¡Contraseña actualizada con éxito!', type: 'success' });
            
            setTimeout(() => {
              setShowPassModal(false);
              setPassActual('');
              setPassNueva('');
              setPassRepetida('');
              setMsgPass({ text: '', type: '' });
            }, 2000);

          } catch (err) {
            setMsgPass({ text: 'Error al actualizar: ' + err.message, type: 'error' });
          }
        };

        const handleExcelSaldosUpload = async (e) => {
          const file = e.target.files[0];
          if (!file) return;

          setSubiendoExcel(true);
          const reader = new FileReader();

          reader.onload = async (evt) => {
            try {
              const bstr = evt.target.result;
              const wb = XLSX.read(bstr, { type: 'binary' });
              const sheetTotal = wb.Sheets['TOTAL'];

              if (!sheetTotal) {
                alert("Error: No se encontró la pestaña 'TOTAL'.");
                setSubiendoExcel(false);
                return;
              }

              const data = XLSX.utils.sheet_to_json(sheetTotal);
              let guardados = 0;
              const ahora = new Date();
              const fechaHoraStr = `${ahora.toLocaleDateString('es-ES')} a las ${ahora.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}`;

              for (const fila of data) {
                const getCol = (possibleNames) => {
                  const key = Object.keys(fila).find(k => 
                    possibleNames.some(p => k.trim().toUpperCase() === p.toUpperCase())
                  );
                  return key ? fila[key] : null;
                };

                const tipRaw = getCol(['TIP']);
                const nombreRaw = getCol(['NOMBRE']);

                if (!tipRaw || !nombreRaw) continue;

                const tipClean = Math.floor(Number(tipRaw));
                if (isNaN(tipClean) || tipClean === 0) continue;

                const tipStr = String(tipClean).padStart(3, '0');
                const usuarioWinRaw = getCol(['USUARIO WINDOWS', 'USUARIO']);
                const usuarioWin = usuarioWinRaw ? String(usuarioWinRaw).toLowerCase().trim() : `policia${tipStr}`;
                const docKey = `${usuarioWin}@policiaportuaria.local`;

                const parseNum = (val) => { const n = Number(val); return isNaN(n) ? 0 : n; };

                await window.fbDb.setDoc(window.fbDb.doc(window.db, "policias", docKey), {
                  nombre: String(nombreRaw).trim(),
                  tip: tipStr,
                  usuarioWindows: usuarioWin,
                  saldos: {
                    vacaciones: {
                      totales: parseNum(getCol(['VACACIONES_T', 'VACACIONES T'])),
                      usados: parseNum(getCol(['VACACIONES_U', 'VACACIONES U'])),
                      pendientes: parseNum(getCol(['VACACIONES_P', 'VACACIONES P']))
                    },
                    asuntosPropios: {
                      totales: parseNum(getCol(['PROPIOS_T', 'PROPIOS T'])),
                      usados: parseNum(getCol(['PROPIOS_U', 'PROPIOS U'])),
                      pendientes: parseNum(getCol(['PROPIOS_P', 'PROPIOS P']))
                    },
                    convenio: {
                      totales: parseNum(getCol(['DISPONIBLE_T', 'DISPONIBLE T'])),
                      usados: parseNum(getCol(['DISPONIBLE_U', 'DISPONIBLE U'])),
                      pendientes: parseNum(getCol(['DISPONIBLE_P', 'DISPONIBLE P']))
                    },
                    vacAdicionales: parseNum(getCol(['VAC_ADIC_P', 'VAC_ADIC', 'VACACIONES ADICIONALES'])),
                    diasAnteriores: parseNum(getCol(['ANTERIOR_P', 'ANTERIOR'])),
                    jornadaVerano: parseNum(getCol(['VERANO_P', 'VERANO'])),
                    fiestasEspeciales: {
                      julio16: parseNum(getCol(['JULIO16_P', 'JULIO16'])),
                      diciembre24: parseNum(getCol(['DICIEMBRE24_P', 'DICIEMBRE24'])),
                      diciembre31: parseNum(getCol(['DICIEMBRE31_P', 'DICIEMBRE31']))
                    },
                    totalGlobal: parseNum(getCol(['TOTAL_P', 'TOTAL P', 'TOTAL PENDIENTE', 'TOTAL']))
                  },
                  ultimaActualizacion: fechaHoraStr
                }, { merge: true });
                guardados++;
              }
              alert(`¡Éxito! Importados ${guardados} agentes con Saldos de Días.`);
              cargarAgentesAdmin();
            } catch (err) {
              alert("Error procesando Excel de Saldos: " + err.message);
            }
            setSubiendoExcel(false);
          };
          reader.readAsBinaryString(file);
        };

        const handleExcelNominaUpload = async (e) => {
          const file = e.target.files[0];
          if (!file) return;

          setSubiendoExcel(true);
          const reader = new FileReader();

          reader.onload = async (evt) => {
            try {
              const bstr = evt.target.result;
              const wb = XLSX.read(bstr, { type: 'binary' });

              const hojasMeses = wb.SheetNames.filter(s => MESES_ORDEN.some(m => s.toLowerCase().includes(m.toLowerCase())));
              
              if (hojasMeses.length === 0) {
                alert("No se han encontrado pestañas con nombres de meses.");
                setSubiendoExcel(false);
                return;
              }

              const agentesData = {};
              const ahora = new Date();
              const fechaHoraStr = `${ahora.toLocaleDateString('es-ES')} a las ${ahora.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}`;

              for (const sheetName of hojasMeses) {
                const mesLimpio = MESES_ORDEN.find(m => sheetName.toLowerCase().includes(m.toLowerCase())) || sheetName;
                const sheet = wb.Sheets[sheetName];
                const rawData = XLSX.utils.sheet_to_json(sheet, { header: 1 });

                let headerRowIndex = rawData.findIndex(row => row && row.some(cell => typeof cell === 'string' && cell.toUpperCase().includes('FESTIVO')));
                if (headerRowIndex === -1) headerRowIndex = 0; 
                
                const headers = Array.from(rawData[headerRowIndex] || []).map(h => String(h || '').trim().toUpperCase());
                const getColIdx = (keywords) => headers.findIndex(h => h && keywords.some(k => h.includes(k)));

                const idxDisp = getColIdx(['DISPONIBLE', 'DISP']);
                const idxViernes = getColIdx(['VIERNES']);
                const idxSabM = getColIdx(['SÁBADOS M', 'SABADO M', 'SÁBADO M', 'MAÑANA']);
                const idxSabT = getColIdx(['SÁBADOS T', 'SABADO T', 'SÁBADO T', 'TARDE']);
                const idxFest = getColIdx(['FESTIVO']);
                const idxObs = getColIdx(['OBSERVACION', 'OBSERVACIONES']);

                for (let i = headerRowIndex + 1; i < rawData.length; i++) {
                  const fila = rawData[i];
                  if (!fila || fila.length < 2) continue;

                  let colNombre = '';
                  for(let cell of fila) {
                    if (typeof cell === 'string' && cell.match(/\[\s*\d+\s*\]/)) {
                      colNombre = cell;
                      break;
                    }
                  }
                  if (!colNombre) colNombre = String(fila[1] || '');

                  // Blindaje de regex contra ceros a la izquierda o espacios raros [ 094 ] o [94]
                  const matchTip = colNombre.match(/\[\s*0*(\d+)\s*\]/);
                  if (!matchTip) continue;

                  const tipClean = Math.floor(Number(matchTip[1]));
                  if (isNaN(tipClean) || tipClean === 0) continue;
                  const tipStr = String(tipClean).padStart(3, '0');
                  const nombreLimpio = colNombre.replace(/\[.*?\]/, '').trim();

                  if (!agentesData[tipStr]) {
                    agentesData[tipStr] = { nombre: nombreLimpio, historicoNominas: {} };
                  }

                  const parseNumSeguro = (idx, fallbackIdx) => {
                    const finalIdx = idx !== -1 ? idx : fallbackIdx;
                    if (finalIdx === -1 || fila[finalIdx] === undefined || fila[finalIdx] === null) return 0;
                    const valStr = String(fila[finalIdx]).trim().replace(',', '.');
                    const n = Number(valStr);
                    return isNaN(n) ? 0 : n;
                  };

                  agentesData[tipStr].historicoNominas[mesLimpio] = {
                    mes: mesLimpio,
                    disponibles: parseNumSeguro(idxDisp, 2),
                    viernesNoche: parseNumSeguro(idxViernes, 3),
                    sabadosManana: parseNumSeguro(idxSabM, 4),
                    sabadosTarde: parseNumSeguro(idxSabT, 5),
                    festivos: parseNumSeguro(idxFest, 6),
                    observaciones: (idxObs !== -1 && fila[idxObs]) ? String(fila[idxObs]).trim() : (fila[7] ? String(fila[7]).trim() : '')
                  };
                }
              }

              // LÓGICA ANTIDUPLICADOS: Preferir siempre el documento real de Windows
              const querySnapshot = await window.fbDb.getDocs(window.fbDb.collection(window.db, "policias"));
              const tipToDocKey = {};
              
              querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                if (!data.tip) return;
                
                const tipStrNormalizado = String(data.tip).trim().replace(/^0+/, '').padStart(3, '0');
                
                if (!tipToDocKey[tipStrNormalizado]) {
                  tipToDocKey[tipStrNormalizado] = docSnap.id;
                } else {
                  const idExistente = tipToDocKey[tipStrNormalizado];
                  const idNuevo = docSnap.id;
                  if (idExistente.startsWith("policia") && !idNuevo.startsWith("policia")) {
                    tipToDocKey[tipStrNormalizado] = idNuevo;
                  }
                }
              });

              let guardados = 0;
              for (const tipStr in agentesData) {
                const docKeyFound = tipToDocKey[tipStr] || `policia${tipStr}@policiaportuaria.local`;
                const dataToSave = agentesData[tipStr];

                await window.fbDb.setDoc(window.fbDb.doc(window.db, "policias", docKeyFound), {
                  nombre: dataToSave.nombre,
                  tip: tipStr,
                  historicoNominas: dataToSave.historicoNominas,
                  ultimaActualizacionNomina: fechaHoraStr
                }, { merge: true });
                guardados++;
              }

              alert(`¡Éxito! Importado el histórico de nóminas para ${guardados} agentes. Duplicados resueltos.`);
              cargarAgentesAdmin();
            } catch (err) {
              alert("Error procesando Excel de Nómina: " + err.message);
            }
            setSubiendoExcel(false);
          };
          reader.readAsBinaryString(file);
        };

        const agentesFiltrados = listaAgentes.filter(a => 
          a.nombre?.toLowerCase().includes(busquedaAdmin.toLowerCase()) ||
          a.tip?.includes(busquedaAdmin) ||
          a.usuarioWindows?.toLowerCase().includes(busquedaAdmin.toLowerCase())
        );

        if (!userSession) {
          return (
            <div className="min-h-screen flex items-center justify-center p-4">
              <div className="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
                <div className="text-center mb-6 flex flex-col items-center">
                  <div className="w-16 h-16 bg-slate-900 rounded-full border-2 border-amber-500 flex items-center justify-center mb-3 shadow-lg">
                    <span className="text-2xl">⚓</span>
                  </div>
                  <h1 className="text-2xl font-black tracking-wider text-white">POLICÍA PORTUARIA</h1>
                  <p className="text-xs text-amber-500 font-bold uppercase tracking-widest mt-1">Autoridad Portuaria de Vigo</p>
                  <p className="text-[11px] text-slate-400 mt-2">Consulta Individual de Permisos y Nómina 2026</p>
                </div>

                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Usuario de Windows</label>
                    <input type="text" placeholder="Ej: adurher" value={usuarioInput} onChange={(e) => setUsuarioInput(e.target.value)} className="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-amber-500" />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Contraseña (Por defecto: TIP)</label>
                    <input type="password" placeholder="Ej: 166" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} className="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-amber-500" />
                  </div>

                  {errorLogin && <p className="text-red-400 text-xs text-center font-medium">{errorLogin}</p>}

                  <button type="submit" className="w-full bg-slate-700 hover:bg-amber-600 text-white font-bold py-3 rounded-lg transition duration-200 shadow-md border border-slate-600 hover:border-amber-500">
                    Consultar Mis Datos
                  </button>
                </form>

                <div className="mt-6 text-center">
                  <button onClick={() => setDarkMode(!darkMode)} className="text-xs text-slate-400 hover:text-amber-400 transition">
                    {darkMode ? '☀️ Cambiar a Modo Claro' : '🌙 Cambiar a Modo Oscuro'}
                  </button>
                </div>
              </div>
            </div>
          );
        }

        return (
          <div className="min-h-screen pb-12 relative">
            {showPassModal && (
              <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                <div className="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-2xl w-full max-w-sm border border-slate-200 dark:border-slate-700">
                  <h3 className="text-lg font-bold text-slate-900 dark:text-white mb-4 flex items-center gap-2">
                    🔑 Cambiar Contraseña
                  </h3>
                  <form onSubmit={cambiarPassword} className="space-y-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Contraseña Actual</label>
                      <input type="password" value={passActual} onChange={(e) => setPassActual(e.target.value)} required className="w-full p-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg text-slate-900 dark:text-white focus:outline-none focus:border-amber-500" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Nueva Contraseña</label>
                      <input type="password" value={passNueva} onChange={(e) => setPassNueva(e.target.value)} required className="w-full p-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg text-slate-900 dark:text-white focus:outline-none focus:border-amber-500" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Repetir Nueva Contraseña</label>
                      <input type="password" value={passRepetida} onChange={(e) => setPassRepetida(e.target.value)} required className="w-full p-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg text-slate-900 dark:text-white focus:outline-none focus:border-amber-500" />
                    </div>
                    
                    {msgPass.text && (
                      <p className={`text-xs font-bold text-center ${msgPass.type === 'error' ? 'text-red-500' : 'text-emerald-500'}`}>
                        {msgPass.text}
                      </p>
                    )}

                    <div className="flex gap-2 mt-4">
                      <button type="button" onClick={() => setShowPassModal(false)} className="flex-1 bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-white font-bold py-2 rounded-lg transition">
                        Cancelar
                      </button>
                      <button type="submit" className="flex-1 bg-amber-600 hover:bg-amber-500 text-white font-bold py-2 rounded-lg transition">
                        Guardar
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            <nav className="bg-slate-900 text-white px-6 py-4 shadow-lg flex justify-between items-center border-b border-slate-800 print:hidden">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 bg-slate-800 rounded-full border border-amber-500 flex items-center justify-center text-lg shadow">⚓</div>
                <div>
                  <h1 className="font-bold text-base leading-tight tracking-wide">POLICÍA PORTUARIA</h1>
                  <p className="text-[11px] text-amber-400 font-medium">Puerto de Vigo · Consulta 2026</p>
                </div>
              </div>

              <div className="flex items-center space-x-3">
                {!userSession.isAdmin && (
                  <button onClick={() => setShowPassModal(true)} className="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 text-sm border border-slate-700" title="Cambiar Contraseña">
                    🔑
                  </button>
                )}
                <button onClick={() => setDarkMode(!darkMode)} className="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-amber-400 text-sm border border-slate-700" title="Cambiar tema">
                  {darkMode ? '☀️' : '🌙'}
                </button>
                <button onClick={() => window.location.reload()} className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-md transition border border-slate-700">
                  Desconectar
                </button>
              </div>
            </nav>

            <main className="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
              {userSession.isAdmin && (
                <div className="bg-slate-800 text-white p-6 rounded-xl shadow-lg border border-slate-700 space-y-4 print:hidden">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div>
                      <h3 className="text-lg font-bold text-amber-400">Panel de Administración</h3>
                      <p className="text-xs text-slate-300">Actualiza los Saldos de Días o el histórico de Nóminas.</p>
                    </div>

                    <div className="flex flex-wrap gap-2">
                      <label className="bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold py-2.5 px-3 rounded-lg cursor-pointer transition shadow border border-slate-500">
                        {subiendoExcel ? 'Procesando...' : '📂 Cargar Excel Saldos'}
                        <input type="file" accept=".xlsx, .xls" onChange={handleExcelSaldosUpload} disabled={subiendoExcel} className="hidden" />
                      </label>

                      <label className="bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold py-2.5 px-3 rounded-lg cursor-pointer transition shadow border border-amber-400">
                        {subiendoExcel ? 'Procesando...' : '💶 Cargar Excel Nómina'}
                        <input type="file" accept=".xlsx, .xls" onChange={handleExcelNominaUpload} disabled={subiendoExcel} className="hidden" />
                      </label>
                    </div>
                  </div>

                  <div className="pt-2 border-t border-slate-700">
                    <input type="text" placeholder="🔍 Buscar agente por TIP, Nombre o Usuario..." value={busquedaAdmin} onChange={(e) => setBusquedaAdmin(e.target.value)} className="w-full p-2.5 bg-slate-900 border border-slate-600 rounded-lg text-sm text-white placeholder-slate-400 focus:outline-none focus:border-amber-500" />
                    {busquedaAdmin && (
                      <div className="mt-2 bg-slate-900 border border-slate-700 rounded-lg max-h-48 overflow-y-auto divide-y divide-slate-800">
                        {agentesFiltrados.length > 0 ? (
                          agentesFiltrados.map((a) => (
                            <div key={a.tip} onClick={() => { setAgenteSeleccionadoAdmin(a); setBusquedaAdmin(''); }} className="p-2.5 hover:bg-slate-800 cursor-pointer flex justify-between items-center text-xs">
                              <span className="font-bold text-slate-200">{a.nombre}</span>
                              <span className="bg-amber-900/60 text-amber-300 px-2 py-0.5 rounded border border-amber-700/50">TIP: {a.tip}</span>
                            </div>
                          ))
                        ) : (
                          <p className="p-3 text-xs text-slate-400 text-center">No se encontraron agentes con ese filtro.</p>
                        )}
                      </div>
                    )}
                  </div>
                </div>
              )}

              {agenteMostrado ? (
                <>
                  <div className="bg-white dark:bg-slate-800 rounded-xl shadow-sm p-5 border border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div>
                      <span className="text-xs font-bold tracking-wider uppercase text-amber-700 dark:text-amber-400 bg-amber-50 dark:bg-amber-950/50 border border-amber-200 dark:border-amber-800 px-2.5 py-1 rounded-md">
                        TIP: {agenteMostrado.tip}
                      </span>
                      <h2 className="text-2xl font-extrabold text-slate-900 dark:text-white mt-2">{agenteMostrado.nombre}</h2>
                    </div>

                    <div className="flex flex-col items-start sm:items-end gap-2">
                      <div className="text-left sm:text-right text-xs text-slate-400">
                        Última act. Saldos: <span className="font-medium text-slate-700 dark:text-slate-300">{agenteMostrado.ultimaActualizacion || 'S/D'}</span><br />
                        Última act. Nómina: <span className="font-medium text-amber-600 dark:text-amber-400">{agenteMostrado.ultimaActualizacionNomina || 'S/D'}</span>
                      </div>

                      <button onClick={() => window.print()} className="text-xs bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 flex items-center gap-1.5 transition print:hidden">
                        🖨️ Imprimir Resumen
                      </button>
                    </div>
                  </div>

                  {agenteMostrado.historicoNominas && Object.keys(agenteMostrado.historicoNominas).length > 0 && (
                    <div className="bg-white dark:bg-slate-800 rounded-xl p-5 border-2 border-amber-500/40 shadow-sm space-y-4">
                      <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-200 dark:border-slate-700 pb-3 gap-3">
                        <div className="flex items-center space-x-2">
                          <span className="text-lg">💶</span>
                          <h3 className="text-sm font-bold uppercase tracking-wider text-amber-600 dark:text-amber-400">Histórico de Nóminas</h3>
                        </div>
                        
                        <div className="flex items-center space-x-2">
                          <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Consultar mes:</span>
                          <select value={mesNominaSeleccionado} onChange={(e) => setMesNominaSeleccionado(e.target.value)} className="bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 text-slate-800 dark:text-slate-200 text-xs rounded-md p-1.5 focus:outline-none focus:border-amber-500 font-bold">
                            {Object.keys(agenteMostrado.historicoNominas)
                              .sort((a, b) => MESES_ORDEN.indexOf(a) - MESES_ORDEN.indexOf(b))
                              .map(mes => (
                                <option key={mes} value={mes}>{mes}</option>
                            ))}
                          </select>
                        </div>
                      </div>

                      {mesNominaSeleccionado && agenteMostrado.historicoNominas[mesNominaSeleccionado] && (
                        <div className="space-y-4">
                          <div className="grid grid-cols-2 sm:grid-cols-5 gap-3 text-center">
                            <div className="bg-slate-50 dark:bg-slate-900/60 p-3 rounded-lg border border-slate-100 dark:border-slate-700">
                              <span className="block text-2xl font-black text-amber-500">{agenteMostrado.historicoNominas[mesNominaSeleccionado].festivos !== undefined ? agenteMostrado.historicoNominas[mesNominaSeleccionado].festivos : 0}</span>
                              <span className="text-[10px] text-slate-500 dark:text-slate-400 font-bold uppercase">Festivos</span>
                            </div>

                            <div className="bg-slate-50 dark:bg-slate-900/60 p-3 rounded-lg border border-slate-100 dark:border-slate-700">
                              <span className="block text-2xl font-black text-indigo-400">{agenteMostrado.historicoNominas[mesNominaSeleccionado].viernesNoche !== undefined ? agenteMostrado.historicoNominas[mesNominaSeleccionado].viernesNoche : 0}</span>
                              <span className="text-[10px] text-slate-500 dark:text-slate-400 font-bold uppercase">Viernes Noche</span>
                            </div>

                            <div className="bg-slate-50 dark:bg-slate-900/60 p-3 rounded-lg border border-slate-100 dark:border-slate-700">
                              <span className="block text-2xl font-black text-blue-400">{agenteMostrado.historicoNominas[mesNominaSeleccionado].sabadosManana !== undefined ? agenteMostrado.historicoNominas[mesNominaSeleccionado].sabadosManana : 0}</span>
                              <span className="text-[10px] text-slate-500 dark:text-slate-400 font-bold uppercase">Sábados Mañana</span>
                            </div>

                            <div className="bg-slate-50 dark:bg-slate-900/60 p-3 rounded-lg border border-slate-100 dark:border-slate-700">
                              <span className="block text-2xl font-black text-blue-500">{agenteMostrado.historicoNominas[mesNominaSeleccionado].sabadosTarde !== undefined ? agenteMostrado.historicoNominas[mesNominaSeleccionado].sabadosTarde : 0}</span>
                              <span className="text-[10px] text-slate-500 dark:text-slate-400 font-bold uppercase">Sábados Tarde</span>
                            </div>

                            <div className="bg-slate-50 dark:bg-slate-900/60 p-3 rounded-lg border border-slate-100 dark:border-slate-700 col-span-2 sm:col-span-1">
                              <span className="block text-2xl font-black text-emerald-400">{agenteMostrado.historicoNominas[mesNominaSeleccionado].disponibles !== undefined ? agenteMostrado.historicoNominas[mesNominaSeleccionado].disponibles : 0}</span>
                              <span className="text-[10px] text-slate-500 dark:text-slate-400 font-bold uppercase">Disponibles</span>
                            </div>
                          </div>

                          {agenteMostrado.historicoNominas[mesNominaSeleccionado].observaciones && (
                            <div className="bg-amber-50 dark:bg-amber-950/30 p-3 rounded-lg border border-amber-200 dark:border-amber-800/50">
                              <span className="block text-[11px] font-bold text-amber-800 dark:text-amber-300 uppercase mb-0.5">Observaciones / Conciliaciones ({mesNominaSeleccionado}):</span>
                              <p className="text-xs text-slate-700 dark:text-slate-200 font-medium">{agenteMostrado.historicoNominas[mesNominaSeleccionado].observaciones}</p>
                            </div>
                          )}
                        </div>
                      )}
                    </div>
                  )}

                  <div className="bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 text-white p-6 rounded-xl shadow-md flex justify-around items-center text-center border-t-2 border-amber-500">
                    <div>
                      <span className="block text-5xl font-black text-amber-400">{agenteMostrado.saldos?.totalGlobal || 0}</span>
                      <span className="text-xs text-slate-300 font-bold uppercase tracking-wider">Total Días Pendientes</span>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div className="bg-white dark:bg-slate-800 p-5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                      <span className="text-xs font-bold text-blue-600 dark:text-blue-400 uppercase tracking-wider bg-blue-50 dark:bg-blue-950/50 px-2 py-0.5 rounded">Vacaciones</span>
                      <div className="flex items-baseline space-x-2 my-2">
                        <span className="text-4xl font-black text-slate-900 dark:text-white">{agenteMostrado.saldos?.vacaciones?.pendientes || 0}</span>
                        <span className="text-xs text-slate-500 dark:text-slate-400 font-medium">pendientes</span>
                      </div>
                      <p className="text-xs text-slate-400 border-t border-slate-100 dark:border-slate-700 pt-2 mt-2">Usados: {agenteMostrado.saldos?.vacaciones?.usados || 0} de {agenteMostrado.saldos?.vacaciones?.totales || 0}</p>
                    </div>

                    <div className="bg-white dark:bg-slate-800 p-5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                      <span className="text-xs font-bold text-emerald-600 dark:text-emerald-400 uppercase tracking-wider bg-emerald-50 dark:bg-emerald-950/50 px-2 py-0.5 rounded">Asuntos Propios</span>
                      <div className="flex items-baseline space-x-2 my-2">
                        <span className="text-4xl font-black text-slate-900 dark:text-white">{agenteMostrado.saldos?.asuntosPropios?.pendientes || 0}</span>
                        <span className="text-xs text-slate-500 dark:text-slate-400 font-medium">disponibles</span>
                      </div>
                      <p className="text-xs text-slate-400 border-t border-slate-100 dark:border-slate-700 pt-2 mt-2">Usados: {agenteMostrado.saldos?.asuntosPropios?.usados || 0} de {agenteMostrado.saldos?.asuntosPropios?.totales || 0}</p>
                    </div>

                    <div className="bg-white dark:bg-slate-800 p-5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                      <span className="text-xs font-bold text-amber-600 dark:text-amber-400 uppercase tracking-wider bg-amber-50 dark:bg-amber-950/50 px-2 py-0.5 rounded">Disp. Adicional</span>
                      <div className="flex items-baseline space-x-2 my-2">
                        <span className="text-4xl font-black text-slate-900 dark:text-white">{agenteMostrado.saldos?.convenio?.pendientes || 0}</span>
                        <span className="text-xs text-slate-500 dark:text-slate-400 font-medium">acumulados</span>
                      </div>
                      <p className="text-xs text-slate-400 border-t border-slate-100 dark:border-slate-700 pt-2 mt-2">Usados: {agenteMostrado.saldos?.convenio?.usados || 0} de {agenteMostrado.saldos?.convenio?.totales || 0}</p>
                    </div>
                  </div>

                  <div className="bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
                    <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 border-b border-slate-100 dark:border-slate-700 pb-2">Otros Saldos y Permisos Especiales</h3>
                    
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 text-center">
                      <div className="bg-slate-50 dark:bg-slate-900/50 p-3 rounded-lg border border-slate-100 dark:border-slate-700/50">
                        <span className="block text-2xl font-bold text-slate-800 dark:text-slate-100">{agenteMostrado.saldos?.vacAdicionales || 0}</span>
                        <span className="text-[11px] text-slate-500 dark:text-slate-400 font-medium uppercase">Vac. Adicionales</span>
                      </div>

                      <div className="bg-slate-50 dark:bg-slate-900/50 p-3 rounded-lg border border-slate-100 dark:border-slate-700/50">
                        <span className="block text-2xl font-bold text-slate-800 dark:text-slate-100">{agenteMostrado.saldos?.diasAnteriores || 0}</span>
                        <span className="text-[11px] text-slate-500 dark:text-slate-400 font-medium uppercase">Días Años Anteriores</span>
                      </div>

                      <div className="bg-slate-50 dark:bg-slate-900/50 p-3 rounded-lg border border-slate-100 dark:border-slate-700/50">
                        <span className="block text-2xl font-bold text-slate-800 dark:text-slate-100">{agenteMostrado.saldos?.jornadaVerano || 0}</span>
                        <span className="text-[11px] text-slate-500 dark:text-slate-400 font-medium uppercase">Jornada Verano</span>
                      </div>

                      <div className="bg-slate-50 dark:bg-slate-900/50 p-3 rounded-lg border border-slate-100 dark:border-slate-700/50">
                        <span className="block text-2xl font-bold text-slate-800 dark:text-slate-100">
                          {(agenteMostrado.saldos?.fiestasEspeciales?.julio16 || 0) + 
                           (agenteMostrado.saldos?.fiestasEspeciales?.diciembre24 || 0) + 
                           (agenteMostrado.saldos?.fiestasEspeciales?.diciembre31 || 0)}
                        </span>
                        <span className="text-[11px] text-slate-500 dark:text-slate-400 font-medium uppercase">Fiestas Especiales</span>
                      </div>
                    </div>
                  </div>
                </>
              ) : null}
            </main>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
