<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Policía Portuaria - Autoridad Portuaria de Vigo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel standalone para leer JSX en navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- XLSX library -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  </head>
  <body class="bg-slate-900 text-slate-100">
    <div id="root"></div>

    <!-- Cargar Firebase Firestore vía CDN -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyC0nN9LYhqmY--jzwbHBo7Uq5mdFpYq57w",
        authDomain: "policia-dias.firebaseapp.com",
        projectId: "policia-dias",
        storageBucket: "policia-dias.firebasestorage.app",
        messagingSenderId: "497323845198",
        appId: "1:497323845198:web:6f124974138c3b758ec51f"
      };

      const app = initializeApp(firebaseConfig);
      window.db = getFirestore(app);
      window.fbDb = { doc, getDoc, setDoc };
    </script>

    <script type="text/babel">
      const { useState } = React;

      function App() {
        const [userSession, setUserSession] = useState(null);
        const [agente, setAgente] = useState(null);
        const [usuarioInput, setUsuarioInput] = useState('');
        const [passwordInput, setPasswordInput] = useState('');
        const [errorLogin, setErrorLogin] = useState('');
        const [subiendoExcel, setSubiendoExcel] = useState(false);

        const handleLogin = async (e) => {
          e.preventDefault();
          setErrorLogin('');
          if (!usuarioInput || !passwordInput) {
            setErrorLogin('Introduce tu usuario y tu TIP de 3 dígitos');
            return;
          }

          const usuarioClean = usuarioInput.toLowerCase().trim();
          const tipInput = passwordInput.trim().padStart(3, '0');

          if (usuarioClean === 'rromdur') {
            setUserSession({ usuario: 'rromdur', isAdmin: true });
            return;
          }

          const docKey = `${usuarioClean}@policiaportuaria.local`;

          try {
            const docRef = window.fbDb.doc(window.db, "policias", docKey);
            const docSnap = await window.fbDb.getDoc(docRef);

            if (docSnap.exists()) {
              const dataAgente = docSnap.data();
              if (String(dataAgente.tip).padStart(3, '0') === tipInput) {
                setAgente(dataAgente);
                setUserSession({ usuario: usuarioClean, isAdmin: false });
              } else {
                setErrorLogin('La TIP / contraseña introducida no es correcta.');
              }
            } else {
              setErrorLogin('Usuario de Windows no encontrado en el sistema.');
            }
          } catch (err) {
            setErrorLogin('Error de conexión al verificar los datos.');
          }
        };

        const handleExcelUpload = async (e) => {
          const file = e.target.files[0];
          if (!file) return;

          setSubiendoExcel(true);
          const reader = new FileReader();

          reader.onload = async (evt) => {
            try {
              const bstr = evt.target.result;
              const wb = XLSX.read(bstr, { type: 'binary' });
              const sheetTotal = wb.Sheets['TOTAL'];

              if (!sheetTotal) {
                alert("Error: No se encontró la pestaña 'TOTAL' en el Excel.");
                setSubiendoExcel(false);
                return;
              }

              // Parsear como JSON estándar usando los nombres de las columnas
              const data = XLSX.utils.sheet_to_json(sheetTotal);
              let guardados = 0;

              for (const fila of data) {
                // Buscamos claves sin importar mayúsculas/minúsculas ni espacios extra
                const getCol = (possibleNames) => {
                  const key = Object.keys(fila).find(k => 
                    possibleNames.some(p => k.trim().toUpperCase() === p.toUpperCase())
                  );
                  return key ? fila[key] : null;
                };

                const tipRaw = getCol(['TIP']);
                const nombreRaw = getCol(['NOMBRE']);

                if (!tipRaw || !nombreRaw) continue;

                const tipClean = Math.floor(Number(tipRaw));
                if (isNaN(tipClean) || tipClean === 0) continue;

                const tipStr = String(tipClean).padStart(3, '0');
                
                const usuarioWinRaw = getCol(['USUARIO WINDOWS', 'USUARIO']);
                const usuarioWin = usuarioWinRaw 
                  ? String(usuarioWinRaw).toLowerCase().trim() 
                  : `policia${tipStr}`;

                const docKey = `${usuarioWin}@policiaportuaria.local`;

                const parseNum = (val) => {
                  const n = Number(val);
                  return isNaN(n) ? 0 : n;
                };

                // Mapeo exacto por nombre de columna
                await window.fbDb.setDoc(window.fbDb.doc(window.db, "policias", docKey), {
                  nombre: String(nombreRaw).trim(),
                  tip: tipStr,
                  usuarioWindows: usuarioWin,
                  saldos: {
                    vacaciones: {
                      totales: parseNum(getCol(['VACACIONES_T', 'VACACIONES T'])),
                      usados: parseNum(getCol(['VACACIONES_U', 'VACACIONES U'])),
                      pendientes: parseNum(getCol(['VACACIONES_P', 'VACACIONES P']))
                    },
                    asuntosPropios: {
                      totales: parseNum(getCol(['PROPIOS_T', 'PROPIOS T'])),
                      usados: parseNum(getCol(['PROPIOS_U', 'PROPIOS U'])),
                      pendientes: parseNum(getCol(['PROPIOS_P', 'PROPIOS P']))
                    },
                    convenio: {
                      totales: parseNum(getCol(['DISPONIBLE_T', 'DISPONIBLE T'])),
                      usados: parseNum(getCol(['DISPONIBLE_U', 'DISPONIBLE U'])),
                      pendientes: parseNum(getCol(['DISPONIBLE_P', 'DISPONIBLE P']))
                    },
                    vacAdicionales: parseNum(getCol(['VAC_ADIC_P', 'VAC_ADIC', 'VACACIONES ADICIONALES'])),
                    diasAnteriores: parseNum(getCol(['ANTERIOR_P', 'ANTERIOR'])),
                    jornadaVerano: parseNum(getCol(['VERANO_P', 'VERANO'])),
                    fiestasEspeciales: {
                      julio16: parseNum(getCol(['JULIO16_P', 'JULIO16'])),
                      diciembre24: parseNum(getCol(['DICIEMBRE24_P', 'DICIEMBRE24'])),
                      diciembre31: parseNum(getCol(['DICIEMBRE31_P', 'DICIEMBRE31']))
                    },
                    totalGlobal: parseNum(getCol(['TOTAL_P', 'TOTAL P', 'TOTAL PENDIENTE', 'TOTAL']))
                  },
                  ultimaActualizacion: new Date().toLocaleDateString('es-ES')
                }, { merge: true });

                guardados++;
              }

              alert(`¡Éxito! Se han importado correctamente ${guardados} agentes con sus saldos exactos.`);
              window.location.reload();
            } catch (err) {
              alert("Error procesando el Excel: " + err.message);
            }
            setSubiendoExcel(false);
          };

          reader.readAsBinaryString(file);
        };

        if (!userSession) {
          return (
            <div className="min-h-screen bg-slate-900 text-slate-100 flex items-center justify-center p-4">
              <div className="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
                <div className="text-center mb-6 flex flex-col items-center">
                  <div className="w-16 h-16 bg-slate-900 rounded-full border-2 border-amber-500 flex items-center justify-center mb-3 shadow-lg">
                    <span className="text-2xl">⚓</span>
                  </div>
                  <h1 className="text-2xl font-black tracking-wider text-white">POLICÍA PORTUARIA</h1>
                  <p className="text-xs text-amber-500 font-bold uppercase tracking-widest mt-1">Autoridad Portuaria de Vigo</p>
                  <p className="text-[11px] text-slate-400 mt-2">Consulta Individual de Permisos 2026</p>
                </div>

                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Usuario de Windows</label>
                    <input 
                      type="text" 
                      placeholder="Ej: adurher"
                      value={usuarioInput}
                      onChange={(e) => setUsuarioInput(e.target.value)}
                      className="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-amber-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Contraseña (TIP 3 Dígitos)</label>
                    <input 
                      type="password" 
                      placeholder="Ej: 166"
                      value={passwordInput}
                      onChange={(e) => setPasswordInput(e.target.value)}
                      className="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-amber-500"
                    />
                  </div>

                  {errorLogin && <p className="text-red-400 text-xs text-center font-medium">{errorLogin}</p>}

                  <button 
                    type="submit" 
                    className="w-full bg-slate-700 hover:bg-amber-600 text-white font-bold py-3 rounded-lg transition duration-200 shadow-md border border-slate-600 hover:border-amber-500"
                  >
                    Consultar Mis Días
                  </button>
                </form>
              </div>
            </div>
          );
        }

        return (
          <div className="min-h-screen bg-slate-100 text-slate-800 pb-12">
            <nav className="bg-slate-900 text-white px-6 py-4 shadow-lg flex justify-between items-center border-b border-slate-800">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 bg-slate-800 rounded-full border border-amber-500 flex items-center justify-center text-lg shadow">
                  ⚓
                </div>
                <div>
                  <h1 className="font-bold text-base leading-tight tracking-wide">POLICÍA PORTUARIA</h1>
                  <p className="text-[11px] text-amber-400 font-medium">Puerto de Vigo · Saldos 2026</p>
                </div>
              </div>
              <button 
                onClick={() => window.location.reload()}
                className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-md transition border border-slate-700"
              >
                Desconectar
              </button>
            </nav>

            <main className="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
              {agente ? (
                <>
                  <div className="bg-white rounded-xl shadow-sm p-5 border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div>
                      <span className="text-xs font-bold tracking-wider uppercase text-amber-700 bg-amber-50 border border-amber-200 px-2.5 py-1 rounded-md">
                        TIP: {agente.tip}
                      </span>
                      <h2 className="text-2xl font-extrabold text-slate-900 mt-2">{agente.nombre}</h2>
                    </div>
                    <div className="text-left sm:text-right text-xs text-slate-400">
                      Última actualización Excel: <br />
                      <span className="font-medium text-slate-700">{agente.ultimaActualizacion}</span>
                    </div>
                  </div>

                  <div className="bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 text-white p-6 rounded-xl shadow-md flex justify-around items-center text-center border-t-2 border-amber-500">
                    <div>
                      <span className="block text-5xl font-black text-amber-400">{agente.saldos?.totalGlobal || 0}</span>
                      <span className="text-xs text-slate-300 font-bold uppercase tracking-wider">Total Días Pendientes</span>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                      <span className="text-xs font-bold text-blue-600 uppercase tracking-wider bg-blue-50 px-2 py-0.5 rounded">Vacaciones</span>
                      <div className="flex items-baseline space-x-2 my-2">
                        <span className="text-4xl font-black text-slate-900">{agente.saldos?.vacaciones?.pendientes || 0}</span>
                        <span className="text-xs text-slate-500 font-medium">pendientes</span>
                      </div>
                      <p className="text-xs text-slate-400 border-t pt-2 mt-2">Usados: {agente.saldos?.vacaciones?.usados || 0} de {agente.saldos?.vacaciones?.totales || 0}</p>
                    </div>

                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                      <span className="text-xs font-bold text-emerald-600 uppercase tracking-wider bg-emerald-50 px-2 py-0.5 rounded">Asuntos Propios</span>
                      <div className="flex items-baseline space-x-2 my-2">
                        <span className="text-4xl font-black text-slate-900">{agente.saldos?.asuntosPropios?.pendientes || 0}</span>
                        <span className="text-xs text-slate-500 font-medium">disponibles</span>
                      </div>
                      <p className="text-xs text-slate-400 border-t pt-2 mt-2">Usados: {agente.saldos?.asuntosPropios?.usados || 0} de {agente.saldos?.asuntosPropios?.totales || 0}</p>
                    </div>

                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                      <span className="text-xs font-bold text-amber-600 uppercase tracking-wider bg-amber-50 px-2 py-0.5 rounded">Disp. Adicional</span>
                      <div className="flex items-baseline space-x-2 my-2">
                        <span className="text-4xl font-black text-slate-900">{agente.saldos?.convenio?.pendientes || 0}</span>
                        <span className="text-xs text-slate-500 font-medium">acumulados</span>
                      </div>
                      <p className="text-xs text-slate-400 border-t pt-2 mt-2">Usados: {agente.saldos?.convenio?.usados || 0} de {agente.saldos?.convenio?.totales || 0}</p>
                    </div>
                  </div>

                  <div className="bg-white rounded-xl p-5 border border-slate-200 shadow-sm space-y-4">
                    <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 border-b pb-2">Otros Saldos y Permisos Especiales</h3>
                    
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 text-center">
                      <div className="bg-slate-50 p-3 rounded-lg border border-slate-100">
                        <span className="block text-2xl font-bold text-slate-800">{agente.saldos?.vacAdicionales || 0}</span>
                        <span className="text-[11px] text-slate-500 font-medium uppercase">Vac. Adicionales</span>
                      </div>

                      <div className="bg-slate-50 p-3 rounded-lg border border-slate-100">
                        <span className="block text-2xl font-bold text-slate-800">{agente.saldos?.diasAnteriores || 0}</span>
                        <span className="text-[11px] text-slate-500 font-medium uppercase">Días Años Anteriores</span>
                      </div>

                      <div className="bg-slate-50 p-3 rounded-lg border border-slate-100">
                        <span className="block text-2xl font-bold text-slate-800">{agente.saldos?.jornadaVerano || 0}</span>
                        <span className="text-[11px] text-slate-500 font-medium uppercase">Jornada Verano</span>
                      </div>

                      <div className="bg-slate-50 p-3 rounded-lg border border-slate-100">
                        <span className="block text-2xl font-bold text-slate-800">
                          {(agente.saldos?.fiestasEspeciales?.julio16 || 0) + 
                           (agente.saldos?.fiestasEspeciales?.diciembre24 || 0) + 
                           (agente.saldos?.fiestasEspeciales?.diciembre31 || 0)}
                        </span>
                        <span className="text-[11px] text-slate-500 font-medium uppercase">Fiestas Especiales</span>
                      </div>
                    </div>
                  </div>
                </>
              ) : (
                <div className="bg-white p-6 rounded-xl text-center shadow-sm border border-slate-200">
                  <h3 className="text-lg font-bold text-slate-900 mb-1">Panel Administrador</h3>
                  <p className="text-slate-600 text-sm mb-4">Sube la plantilla Excel para sincronizar todos los saldos directamente.</p>
                  
                  <div className="bg-slate-800 text-white p-5 rounded-xl text-left max-w-xl mx-auto shadow-md border-t-2 border-amber-500">
                    <h4 className="font-bold text-sm text-slate-200 mb-1">Cargar Plantilla Excel 2026</h4>
                    <p className="text-xs text-slate-400 mb-3">Sube el archivo para volcar los saldos exactos a Firestore.</p>
                    <input 
                      type="file" 
                      accept=".xlsx, .xls"
                      onChange={handleExcelUpload}
                      disabled={subiendoExcel}
                      className="block w-full text-xs text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-white hover:file:bg-amber-600 cursor-pointer"
                    />
                    {subiendoExcel && <p className="text-xs text-amber-400 mt-2 animate-pulse">Sincronizando registros con Firestore...</p>}
                  </div>
                </div>
              )}
            </main>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
